name: Itqan CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: itqan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and controlled-content guards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate controlled Arabic content
        run: node scripts/validate-controlled-content.mjs

      - name: Validate controlled batch
        run: node scripts/validate-batch02.mjs

      - name: Reject Arabic in blueprints
        run: node scripts/validate-blueprints-no-arabic.mjs

      - name: Reject Arabic in learning engine
        run: node scripts/validate-learning-engine-no-arabic.mjs

      - name: Validate blueprint references
        run: node scripts/validate-blueprint-crossrefs.mjs

      - name: Reject hard-coded Arabic exercise UI
        run: node scripts/validate-ui-no-arabic-content.mjs

      - name: Validate adaptive progress layer
        run: |
          node scripts/validate-batch05-no-arabic.mjs
          node scripts/validate-batch05-connections.mjs

      - name: Validate visual learning layer
        run: |
          node scripts/validate-batch06-no-arabic.mjs
          node scripts/validate-batch06-visual-contract.mjs

      - name: Validate deep session progression
        run: node scripts/validate-session-progression.mjs

      - name: Test learning policy invariants
        run: npm run test:learning

      - name: Test voice Worker behavior
        run: npm run test:worker

      - name: Production build
        run: npm run build

      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run
