name: Itqan CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: itqan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and controlled-content guards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate browser audit scripts
        run: |
          node --check scripts/smoke-production-browser.mjs
          node --check scripts/audit-v1-learner-journey.mjs

      - name: Validate controlled Arabic content
        run: node scripts/validate-controlled-content.mjs

      - name: Validate controlled batch
        run: node scripts/validate-batch02.mjs

      - name: Reject Arabic in blueprints
        run: node scripts/validate-blueprints-no-arabic.mjs

      - name: Reject Arabic in learning engine
        run: node scripts/validate-learning-engine-no-arabic.mjs

      - name: Validate blueprint references
        run: node scripts/validate-blueprint-crossrefs.mjs

      - name: Validate interaction mode coverage
        run: npm run test:interaction-modes

      - name: Test lesson session presentation
        run: npm run test:lesson-presentation

      - name: Validate active session policy
        run: |
          node scripts/validate-active-session-policy.mjs
          npm run test:activation-policy

      - name: Validate aggregate content command
        run: npm run validate:content

      - name: Validate V1 human-review record
        run: |
          npm run validate:v1-human-review
          npm run test:v1-human-review
          npm run test:v1-human-review-surface

      - name: Validate source traceability registry
        run: npm run test:source-traceability

      - name: Validate precision-before-timing wiring
        run: node scripts/validate-timing-policy-wiring.mjs

      - name: Reject hard-coded Arabic exercise UI
        run: node scripts/validate-ui-no-arabic-content.mjs

      - name: Validate adaptive progress layer
        run: |
          node scripts/validate-batch05-no-arabic.mjs
          node scripts/validate-batch05-connections.mjs

      - name: Validate visual learning layer
        run: |
          node scripts/validate-batch06-no-arabic.mjs
          node scripts/validate-batch06-visual-contract.mjs

      - name: Validate deep session progression
        run: node scripts/validate-session-progression.mjs

      - name: Test learning policy invariants
        run: npm run test:learning

      - name: Test controlled path mastery reachability
        run: node --import ./scripts/register-typescript-loader.mjs scripts/test-controlled-path-reachability.ts

      - name: Test mastery stability safety
        run: npm run test:mastery

      - name: Test learner persistence safety
        run: npm run test:persistence

      - name: Test session engine safety
        run: npm run test:session-engine

      - name: Test voice Worker behavior
        run: npm run test:worker

      - name: Production build
        run: npm run build

      - name: Audit V1 production-build learner journey
        run: node scripts/audit-v1-learner-journey.mjs

      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run
