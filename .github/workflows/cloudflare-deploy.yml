name: Deploy Itqan to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itqan-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-check production shell
        shell: bash
        run: |
          set -euo pipefail
          url="https://itqan.gassamasa.workers.dev/"
          for attempt in 1 2 3 4 5 6; do
            response="$(curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --header 'Cache-Control: no-cache' \
              "$url" || true)"
            if [[ "$response" == *'<div id="root"></div>'* ]]; then
              echo "Production shell smoke check passed on attempt $attempt."
              exit 0
            fi
            echo "Production shell not ready yet (attempt $attempt/6); retrying in 10s."
            sleep 10
          done
          echo "Production shell smoke check failed: expected Itqan application shell was not served."
          exit 1

      - name: Smoke-check rendered production journey
        run: node scripts/smoke-production-browser.mjs https://itqan.gassamasa.workers.dev/
