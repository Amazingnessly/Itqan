name: Temporary interaction instruction patch

on:
  push:
    branches:
      - codex/enforce-interaction-mode-support

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/enforce-interaction-mode-support
          fetch-depth: 0

      - name: Apply exhaustive interaction instruction patch
        run: node scripts/patch-interaction-instructions.mjs

      - name: Commit lesson page change
        run: |
          if git diff --quiet -- src/pages/Lesson/LessonPage.tsx; then
            echo "Lesson page already uses the exhaustive interaction instruction contract."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Lesson/LessonPage.tsx
          git commit -m "Use exhaustive interaction instructions"
          git push origin HEAD:codex/enforce-interaction-mode-support
