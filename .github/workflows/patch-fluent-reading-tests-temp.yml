name: Temporary fluent-reading test fixture patch

on:
  push:
    branches:
      - codex/activate-fluent-reading-s01-s03

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/activate-fluent-reading-s01-s03
          fetch-depth: 0

      - name: Update fluent-reading learning-policy fixtures
        run: node scripts/patch-fluent-reading-test-fixtures.mjs

      - name: Commit test changes
        run: |
          if git diff --quiet -- scripts/test-learning-policy.ts; then
            echo "Learning-policy fixtures already match active fluent-reading content."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-learning-policy.ts
          git commit -m "Update learning policy for active fluent-reading contexts"
          git push origin HEAD:codex/activate-fluent-reading-s01-s03
