name: Temporary blueprint timing policy hardening

on:
  push:
    branches:
      - codex/activate-vowels-sukun-s01-s03

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/activate-vowels-sukun-s01-s03
          fetch-depth: 0

      - name: Enforce precision-before-timing policy
        run: node scripts/patch-blueprint-timing-policy.mjs

      - name: Commit hardened blueprint policies
        run: |
          if git diff --quiet -- public/content/blueprints; then
            echo "Blueprint timing policies already satisfy the contract."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/content/blueprints
          git commit -m "Require precision stability before timing"
          git push origin HEAD:codex/activate-vowels-sukun-s01-s03
